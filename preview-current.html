<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoleTasker verified preview</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#fff}.loading{min-height:100vh;display:grid;place-items:center;color:#1C2B3A;font-weight:700;padding:24px;text-align:center}.error{max-width:680px;padding:32px;line-height:1.5}</style>
</head>
<body>
<div class="loading">Loading verified SoleTasker preview…</div>
<script>
(async()=>{
  const branch='update/lovable-mocks-myday';
  const repo='https://raw.githubusercontent.com/osullivancal-collab/soletasker-landing/'+branch+'/';
  try{
    let h=await fetch(repo+'index.html?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('GitHub '+r.status);return r.text()});
    h=h.replaceAll('src="/logo.png"','src="'+repo+'logo.png"');
    h=h.replace(/href="\/(?!\/)/g,'href="https://raw.githack.com/osullivancal-collab/soletasker-landing/'+branch+'/');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="error"><h2>Preview failed to load</h2><p>'+String(e)+'</p></div>';
  }
})();
</script>
</body>
</html>
