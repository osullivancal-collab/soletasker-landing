name: Remove personal loss copy

on:
  push:
    branches:
      - fix/remove-loss-copy

permissions:
  contents: write

jobs:
  edit-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-loss-copy
          fetch-depth: 0
      - name: Replace founder copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''      <p class="bbt-body">
        We were losing money we'd already earned. Forgetting jobs. Losing certs. Invoices never going out. <strong>SoleTasker was built by Calec Electrical — a working Australian electrical business — because every other tool felt like software. We needed something that just worked on-site.</strong>
      </p>'''
          new = '''      <p class="bbt-body">
        SoleTasker was built by Calec Electrical — a working Australian electrical business — around the way we actually work: on site, in the van and on the phone. It gives us a simple place to capture jobs, tasks, reminders and site admin without turning the day into more software.
      </p>'''
          if old not in text:
              raise SystemExit('Expected founder paragraph not found; no changes made.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/remove-loss-copy.yml').unlink(missing_ok=True)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove personal loss copy from landing page"
          git push origin HEAD:fix/remove-loss-copy
