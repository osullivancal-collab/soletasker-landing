name: Standardize final pricing wording

on:
  push:
    branches:
      - fix/pricing-29-ex-gst

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-29-ex-gst
          fetch-depth: 0
      - name: Standardize price display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            '$29 per month (ex GST)': '$29/month ex GST',
            '$29 AUD per month (ex GST)': '$29/month ex GST',
            'Australian businesses registered for GST will need to add 10% GST on top, making it $31.90/month inc GST.': 'GST is added at checkout where applicable.',
            "If you're registered for GST, add 10% (total $31.90/month inc. GST)": 'GST is added at checkout where applicable',
          }

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/pricing-final.yml').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Standardize all pricing as $29/month ex GST'
          git push origin HEAD:fix/pricing-29-ex-gst
