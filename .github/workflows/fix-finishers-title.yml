name: Fix finishers title

on:
  push:
    branches:
      - live/fix-finishers-title
    paths:
      - scripts/fix_finishers_title.py
      - .github/workflows/fix-finishers-title.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live/fix-finishers-title
          fetch-depth: 0
      - run: python scripts/fix_finishers_title.py
      - run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct review future work and SWMS title"
          git push origin HEAD:live/fix-finishers-title
