name: Apply Lovable landing update

on:
  push:
    branches:
      - update/lovable-mocks-myday
    paths:
      - scripts/apply_lovable_update.py
      - .github/workflows/apply-lovable-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: update/lovable-mocks-myday
          fetch-depth: 0
      - name: Apply targeted landing update
        run: python scripts/apply_lovable_update.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update product mocks and add My Day section"
          git push origin HEAD:update/lovable-mocks-myday
