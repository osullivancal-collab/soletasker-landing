name: Apply Lovable landing update

on:
  push:
    branches:
      - update/lovable-mocks-myday
    paths:
      - scripts/apply_lovable_update.py
      - scripts/patch_finishers_section.py
      - scripts/apply_real_cost_and_typography.py
      - scripts/patch_final_cta.py
      - scripts/patch_home_cta_brand_titles.py
      - scripts/patch_brand_consistency.py
      - scripts/patch_intake_and_copy.py
      - scripts/patch_smart_onsite.py
      - scripts/patch_myday_mock.py
      - .github/workflows/apply-lovable-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: update/lovable-mocks-myday
          fetch-depth: 0
      - name: Apply product mocks and My Day update
        run: python scripts/apply_lovable_update.py
      - name: Apply finishers section update
        run: python scripts/patch_finishers_section.py
      - name: Apply Real Cost and typography update
        run: python scripts/apply_real_cost_and_typography.py
      - name: Apply final CTA update
        run: python scripts/patch_final_cta.py
      - name: Apply Home terminology and brand title rules
        run: python scripts/patch_home_cta_brand_titles.py
      - name: Apply canonical logo and brand colour consistency
        run: python scripts/patch_brand_consistency.py
      - name: Sharpen copy and rebuild Job Intake flow
        run: python scripts/patch_intake_and_copy.py
      - name: Build interactive smart on-site tools
        run: python scripts/patch_smart_onsite.py
      - name: Update My Day mock content and footer
        run: python scripts/patch_myday_mock.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update cumulative landing preview"
          git push origin HEAD:update/lovable-mocks-myday
