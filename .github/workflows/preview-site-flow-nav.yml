name: Preview site flow and navigation

on:
  push:
    branches:
      - preview/site-flow-nav
    paths:
      - scripts/patch_site_flow_nav.py
      - .github/workflows/preview-site-flow-nav.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/site-flow-nav
          fetch-depth: 0

      - name: Apply site flow and navigation patch
        run: python scripts/patch_site_flow_nav.py

      - name: Commit generated marketing pages
        run: |
          if git diff --quiet -- index.html use-cases.html pricing.html; then
            echo "No generated page changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html use-cases.html pricing.html
          git commit -m "Update site flow and navigation"
          git push origin HEAD:preview/site-flow-nav
