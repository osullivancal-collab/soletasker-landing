name: Clean pricing wording

on:
  push:
    branches:
      - fix/pricing-29-ex-gst

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-29-ex-gst
          fetch-depth: 0
      - name: Fix wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            '$29 ex GST/month (ex GST)': '$29/month ex GST',
            '$29 ex GST<span>/month <small style="font-size:12px;color:var(--ink-ghost)">ex GST</small></span>': '$29<span>/month <small style="font-size:12px;color:var(--ink-ghost)">ex GST</small></span>',
            '$29 ex GST standard rate': '$29/month ex GST',
            '$29 ex GST AUD per month (excl. GST)': '$29 AUD per month (ex GST)',
          }
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          Path('.github/workflows/pricing-cleanup.yml').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Clean pricing wording'
          git push origin HEAD:fix/pricing-29-ex-gst
