name: Generate landing copy cleanup

on:
  push:
    branches:
      - fix/landing-copy-cleanup
    paths:
      - scripts/patch_myday_mock.py
      - .github/workflows/apply-copy-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-copy-cleanup
          fetch-depth: 0
      - name: Apply approved copy cleanup
        run: python scripts/patch_myday_mock.py
      - name: Commit generated page and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-copy-cleanup.yml
          git add index.html .github/workflows/apply-copy-cleanup.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Apply landing copy cleanup"
          git push origin HEAD:fix/landing-copy-cleanup
