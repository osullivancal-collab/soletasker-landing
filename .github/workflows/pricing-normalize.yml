name: Normalize SoleTasker pricing copy

on:
  push:
    branches:
      - fix/pricing-29-ex-gst

permissions:
  contents: write

jobs:
  normalize-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-29-ex-gst
          fetch-depth: 0
      - name: Normalize pricing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # SoleTasker subscription price is always A$29/month ex GST.
              text = re.sub(r'\$(?:19|24|27)/month(?:\s*(?:ex GST|\(ex GST\)))?', '$29/month ex GST', text)
              text = re.sub(r'\$29/month(?!\s*(?:ex GST|\(ex GST\)))', '$29/month ex GST', text)
              text = re.sub(r'\$29 per month(?!\s*(?:ex GST|\(ex GST\)))', '$29 per month (ex GST)', text)

              # 10% GST on $29 is $2.90, so the GST-inclusive total is $31.90.
              text = text.replace('$29.70/month inc GST', '$31.90/month inc GST')
              text = text.replace('$29.70 per month inc GST', '$31.90 per month inc GST')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'no HTML files needed changes')

          # Audit every literal $29 website mention. It must have GST context on the same line.
          bad = []
          for path in Path('.').glob('*.html'):
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '$29' in line and 'GST' not in line:
                      bad.append(f'{path}:{n}: {line.strip()}')
          if bad:
              raise SystemExit('Price mentions missing GST context:\n' + '\n'.join(bad))

          # Remove this temporary workflow so the final branch diff contains only the website fix.
          Path('.github/workflows/pricing-normalize.yml').unlink(missing_ok=True)
          PY
      - name: Commit normalized pricing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix pricing copy to $29/month ex GST"
          git push origin HEAD:fix/pricing-29-ex-gst
